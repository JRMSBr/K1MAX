[gcode_macro TEST_BM]
description: W
gcode:
    {% if printer['output_pin BM'].value == 0 %}
       RESPOND TYPE=command MSG="PIN BM desligado"
      {% endif %}

      {% if printer['output_pin BM'].value == 1 %}
       RESPOND TYPE=command MSG="Pin BM ligado"
      {% endif %}

