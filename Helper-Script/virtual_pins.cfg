[gcode_macro TEST_BED]
description: W
gcode:
    {% if printer['output_pin BM'].value == 0 %}
       RESPOND TYPE=command MSG="PIN BM desligado"
      {% endif %}

      {% if printer['output_pin BM'].value == 1 %}
       RESPOND TYPE=command MSG="Pin BM ligado"
      {% endif %}

      [gcode_macro TEST_QMEP]
description: W
gcode:
    {% if printer['output_pin QMEP'].value == 0 %}
       RESPOND TYPE=command MSG="PIN QMEP desligado"
      {% endif %}

      {% if printer['output_pin QMEP'].value == 1 %}
       RESPOND TYPE=command MSG="PIN QMEP ligado"
      {% endif %}