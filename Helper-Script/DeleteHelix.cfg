[gcode_shell_command deletehelix]
command: sh /usr/data/install.sh --uninstall
timeout: 600.0
verbose: True

[gcode_macro RUNOUTHELIX]
description: Apaga o helix... tomara
gcode:
  RUN_SHELL_COMMAND CMD=deletehelix
  RESPOND TYPE=command MSG="Comando executado.... nao sei se deu certo"




[gcode_shell_command insthelix]
command: sh /usr/data/install.sh --local /usr/data/helixscreen-k1-v0.99.4.tar.gz
timeout: 600.0
verbose: True

[gcode_macro INSTALLHELIX]
description: Instala o helix... tomara
gcode:
  RUN_SHELL_COMMAND CMD=insthelix
  RESPOND TYPE=command MSG="Comando executado.... nao sei se deu certo"




[gcode_shell_command liberatela]
command: chmod +x /etc/init.d/S99start_app
timeout: 600.0
verbose: True

[gcode_macro VOLTA]
description: volta tela... tomara
gcode:
  RUN_SHELL_COMMAND CMD=liberatela
  RESPOND TYPE=command MSG="Comando executado.... nao sei se deu certo"




[gcode_shell_command voltatela]
command: /etc/init.d/S99start_app start
timeout: 600.0
verbose: True

[gcode_macro VOLTAA]
description: volta tela... tomara
gcode:
  RUN_SHELL_COMMAND CMD=voltatela
  RESPOND TYPE=command MSG="Comando executado.... nao sei se deu certo"