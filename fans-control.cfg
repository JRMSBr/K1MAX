[gcode_macro TEST_LEVEL]
description: W
gcode:
    {% if printer['output_pin LEVEL'].value == 0 %}
       RESPOND PREFIX="INFO" MSG="PIN BM desligado"
      {% endif %}

      {% if printer['output_pin LEVEL'].value == 1 %}
       RESPOND PREFIX="INFO" MSG="Pin BM ligado"
      {% endif %}

